{% extends "templates/web.html" %}
{% block title %}Đăng nhập xưởng{% endblock %}
{% block page_content %}
<div style="max-width:32rem;margin:3rem auto;padding:0 1rem;font-family:system-ui,sans-serif">
  <h1 style="font-size:1.4rem;margin-bottom:1rem">Không vào được</h1>
  <p style="font-size:1.05rem;line-height:1.6;color:#b45309;font-weight:600">
    {{ loi or "Đường dẫn không hợp lệ." }}
  </p>
  <p style="font-size:1rem;line-height:1.6;color:#475569">
    Bạn vẫn đăng nhập được bằng <b>số điện thoại</b> và <b>mật khẩu</b> in trên thẻ.
  </p>
  <p><a href="/login?redirect-to=/sx"
        style="display:inline-block;margin-top:.5rem;padding:.7rem 1.2rem;border-radius:.5rem;
               background:#0f172a;color:#fff;text-decoration:none;font-weight:700">
    Đăng nhập bằng số điện thoại</a></p>
</div>
{% endblock %}
